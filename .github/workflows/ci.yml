name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run Playwright E2E (dev mode, mock AI)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_ENV: test
          AUTH_MODE: dev
          DATA_STORE: file
          AI_PROVIDER: mock
      - run: npm run build
        env:
          # Build-time values only; real values are set on the hosting provider.
          VITE_API_URL: https://api.example.com
          VITE_WIDGET_URL: https://api.example.com/widget.js
          VITE_PUBLIC_APP_URL: https://app.example.com
          WIDGET_DEFAULT_API_URL: https://api.example.com

  e2e:
    name: Playwright E2E
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
