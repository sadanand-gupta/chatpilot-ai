# Render Blueprint — ChatPilot AI API (apps/api, also serves /widget.js)
# Spec: https://render.com/docs/blueprint-spec (checked 2026-10-17)
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render prompts once for
# every `sync: false` value (only FIREBASE_PRIVATE_KEY and AI_API_KEY). See docs/DEPLOYMENT.md §6.
#
# PLAN: `free` spins down after 15 min idle (~1 min cold start), may restart at any
# time, and Render says not to use it for production. For launch switch to
# `starter` (legacy alias of `0.5c-512mb`: 0.5 CPU / 512 MB, $7/month as of 2026-10-17).

services:
  - type: web
    name: chatpilot-ai-api       # "chatpilot-api" subdomain is taken on onrender.com
    runtime: node
    region: singapore          # closest Render region to India (others: oregon, ohio, virginia, frankfurt)
    plan: free                 # → starter for production
    rootDir: .                 # npm workspaces need the repo root
    # --include=dev: NODE_ENV=production below would otherwise make `npm ci` skip
    # devDependencies (tsup, esbuild, typescript) and the build would fail.
    buildCommand: npm ci --include=dev && npm run build -w @chatpilot/widget && npm run build -w @chatpilot/api
    startCommand: npm run start -w @chatpilot/api
    healthCheckPath: /health
    autoDeployTrigger: commit  # or checksPass to wait for GitHub CI
    envVars:
      # ── runtime ────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: PRODUCT_NAME
        value: ChatPilot AI
      # ── public URLs (set after you know your domains) ──────────
      - key: FRONTEND_URLS          # e.g. https://app.example.com,https://chatpilot-web.pages.dev
        value: "https://a1help.vercel.app"
      - key: PUBLIC_APP_URL         # e.g. https://app.example.com
        value: "https://a1help.vercel.app"
      - key: PUBLIC_API_URL         # e.g. https://chatpilot-ai-api.onrender.com
        value: "https://chatpilot-ai-api.onrender.com"
      - key: WIDGET_DEFAULT_API_URL # baked into widget.js at build time, e.g. https://chatpilot-ai-api.onrender.com
        value: "https://chatpilot-ai-api.onrender.com"
      - key: WIDGET_PRODUCT_URL     # "Powered by" link in widget.js, e.g. https://your-app-domain.com
        value: "https://a1help.vercel.app"
      - key: PUBLIC_WIDGET_URL      # e.g. https://chatpilot-ai-api.onrender.com/widget.js
        value: "https://chatpilot-ai-api.onrender.com/widget.js"
      # ── production modes (the API refuses dev/file/mock in production) ──
      - key: AUTH_MODE
        value: firebase
      - key: DATA_STORE
        value: firestore
      # ── Firebase Admin (secrets) ───────────────────────────────
      - key: FIREBASE_PROJECT_ID
        value: "chatpilot-ai-43451"
      - key: FIREBASE_CLIENT_EMAIL
        value: "firebase-adminsdk-fbsvc@chatpilot-ai-43451.iam.gserviceaccount.com"
      - key: FIREBASE_PRIVATE_KEY   # one line, newlines escaped as \n (see docs/DEPLOYMENT.md §5)
        sync: false
      # ── AI provider ────────────────────────────────────────────
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL            # e.g. https://generativelanguage.googleapis.com/v1beta/openai
        value: "https://api.groq.com/openai/v1"
      - key: AI_MODEL               # e.g. gemini-2.5-flash-lite
        value: "openai/gpt-oss-120b"
      - key: AI_API_KEY
        sync: false
      - key: AI_REASONING_EFFORT    # gpt-oss on Groq: keep thinking short
        value: low
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_MAX_CONCURRENCY
        value: "4"
      - key: MAX_OUTPUT_TOKENS
        value: "1200"
      - key: AI_TEMPERATURE
        value: "0.3"
      # ── secrets generated by Render (random 256-bit, base64) ───
      - key: CONVERSATION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # ── limits (tune later; API defaults apply if removed) ─────
      - key: MAX_CRAWL_PAGES
        value: "50"
      - key: MAX_CRAWL_DEPTH
        value: "3"
      - key: CRAWL_CONCURRENCY
        value: "3"
      - key: CRAWL_PAGE_TIMEOUT_MS
        value: "20000"
      - key: CRAWL_MAX_PAGE_BYTES
        value: "2000000"
      - key: MAX_MESSAGE_LENGTH
        value: "2000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: PUBLIC_CHAT_RATE_LIMIT
        value: "20"
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_MAX_PAGES
        value: "10"
      - key: DEMO_MAX_MESSAGES
        value: "10"
      - key: DEMO_PER_IP_PER_HOUR
        value: "3"
      # Optional: PLANS_JSON, SCREENSHOT_URL_TEMPLATE, WIDGET_DIST_DIR — add in the dashboard if needed.
