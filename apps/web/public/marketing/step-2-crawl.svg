<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="s2-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="s2-title">ChatPilot AI crawls and indexes your pages</title>
  <defs>
    <linearGradient id="s2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="s2-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="s2-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset=".85" stop-color="#6366F1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity=".9"/>
    </linearGradient>
    <filter id="s2-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#312E81" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity=".06"/>
    </filter>
    <g id="s2-thumb">
      <rect width="88" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="8" y="8" width="20" height="5" rx="2.5" fill="#CBD5E1"/>
      <rect x="62" y="8" width="18" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="8" y="20" width="46" height="7" rx="3" fill="#94A3B8"/>
      <rect x="8" y="32" width="40" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="8" y="40" width="34" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="58" y="20" width="22" height="24" rx="4" fill="#E0E7FF"/>
      <rect x="8" y="52" width="72" height="4" rx="2" fill="#E2E8F0"/>
    </g>
    <g id="s2-check">
      <circle r="11" fill="#10B981"/>
      <path d="M-4.6 .2l3.2 3.2 6-6.2" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <clipPath id="s2-clip"><rect width="480" height="320" rx="24"/></clipPath>
  </defs>
  <rect width="480" height="320" rx="24" fill="url(#s2-bg)"/>
  <g clip-path="url(#s2-clip)">
    <circle cx="440" cy="40" r="60" fill="#E0E7FF" opacity=".6"/>
  </g>

  <g filter="url(#s2-shadow)">
    <rect x="40" y="34" width="400" height="254" rx="18" fill="#FFFFFF"/>
  </g>
  <!-- header -->
  <text x="62" y="66" font-size="13.5" font-weight="700" fill="#0F172A">Crawling yourbusiness.com</text>
  <rect x="340" y="50" width="78" height="22" rx="11" fill="#EEF2FF"/>
  <text x="379" y="65" font-size="10.5" font-weight="600" fill="#4F46E5" text-anchor="middle">Scanning&#8230;</text>

  <!-- page cards -->
  <g>
    <rect x="62" y="84" width="108" height="114" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <use href="#s2-thumb" transform="translate(72 94)"/>
    <text x="72" y="182" font-size="11.5" font-weight="600" fill="#334155">/home</text>
    <use href="#s2-check" transform="translate(162 92)"/>
  </g>
  <g>
    <rect x="186" y="84" width="108" height="114" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <use href="#s2-thumb" transform="translate(196 94)"/>
    <text x="196" y="182" font-size="11.5" font-weight="600" fill="#334155">/services</text>
    <use href="#s2-check" transform="translate(286 92)"/>
  </g>
  <g>
    <rect x="310" y="84" width="108" height="114" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
    <use href="#s2-thumb" transform="translate(320 94)"/>
    <rect x="320" y="114" width="88" height="22" fill="url(#s2-scan)"/>
    <text x="320" y="182" font-size="11.5" font-weight="600" fill="#4F46E5">/contact</text>
    <circle cx="410" cy="92" r="11" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="3"/>
    <path d="M410 81a11 11 0 0 1 10.5 14.3" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- progress -->
  <text x="62" y="228" font-size="11.5" fill="#64748B">Pages indexed</text>
  <text x="418" y="228" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="end">24 pages &#183; 312 chunks</text>
  <rect x="62" y="238" width="356" height="8" rx="4" fill="#E0E7FF"/>
  <rect x="62" y="238" width="290" height="8" rx="4" fill="url(#s2-brand)"/>
  <circle cx="68" cy="268" r="3" fill="#10B981"/>
  <text x="78" y="272" font-size="11" fill="#64748B">Extracting services, hours, FAQs &amp; contact info</text>
</svg>
