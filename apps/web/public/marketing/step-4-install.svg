<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="s4-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="s4-title">Install with one script tag</title>
  <defs>
    <linearGradient id="s4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="s4-code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="s4-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E1B4B" flood-opacity=".24"/>
    </filter>
    <filter id="s4-shadow-sm" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#047857" flood-opacity=".3"/>
    </filter>
    <clipPath id="s4-clip"><rect width="480" height="320" rx="24"/></clipPath>
  </defs>
  <rect width="480" height="320" rx="24" fill="url(#s4-bg)"/>
  <g clip-path="url(#s4-clip)">
    <circle cx="60" cy="270" r="64" fill="#E0E7FF" opacity=".7"/>
  </g>

  <g filter="url(#s4-shadow)">
    <rect x="30" y="40" width="420" height="206" rx="16" fill="url(#s4-code)"/>
  </g>
  <!-- title bar -->
  <circle cx="52" cy="62" r="5" fill="#F87171"/>
  <circle cx="68" cy="62" r="5" fill="#FBBF24"/>
  <circle cx="84" cy="62" r="5" fill="#34D399"/>
  <rect x="104" y="51" width="84" height="22" rx="7" fill="#FFFFFF" fill-opacity=".08"/>
  <text x="146" y="66" font-size="11" font-weight="500" fill="#C7D2FE" text-anchor="middle">index.html</text>
  <rect x="372" y="51" width="62" height="22" rx="7" fill="#FFFFFF" fill-opacity=".08"/>
  <path d="M383 58h6a1.5 1.5 0 0 1 1.5 1.5V67" fill="none" stroke="#A5B4FC" stroke-width="1.3"/>
  <rect x="380" y="60.5" width="7.5" height="8" rx="1.5" fill="none" stroke="#A5B4FC" stroke-width="1.3"/>
  <text x="397" y="66" font-size="11" font-weight="500" fill="#C7D2FE">Copy</text>
  <path d="M30 84h420" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- code -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">
    <text x="48" y="108" fill="#475569">1</text>
    <text x="48" y="128" fill="#475569">2</text>
    <text x="48" y="148" fill="#475569">3</text>
    <text x="48" y="168" fill="#475569">4</text>
    <text x="48" y="188" fill="#475569">5</text>
    <text x="48" y="208" fill="#475569">6</text>
    <text x="48" y="228" fill="#475569">7</text>
    <rect x="64" y="134" width="372" height="80" rx="6" fill="#6366F1" fill-opacity=".14"/>
    <rect x="64" y="134" width="3" height="80" rx="1.5" fill="#818CF8"/>
    <text x="74" y="108" fill="#64748B">&lt;!-- ChatPilot AI --&gt;</text>
    <text x="74" y="128" fill="#94A3B8">&lt;/main&gt;</text>
    <text x="74" y="148"><tspan fill="#F472B6">&lt;script</tspan></text>
    <text x="94" y="168"><tspan fill="#A5B4FC">src</tspan><tspan fill="#E2E8F0">=</tspan><tspan fill="#6EE7B7">"https://&#8230;/widget.js"</tspan></text>
    <text x="94" y="188"><tspan fill="#A5B4FC">data-chatbot-id</tspan><tspan fill="#E2E8F0">=</tspan><tspan fill="#6EE7B7">"cb_7f3k9x2q"</tspan></text>
    <text x="94" y="208"><tspan fill="#A5B4FC">async</tspan><tspan fill="#F472B6">&gt;&lt;/script&gt;</tspan></text>
    <text x="74" y="228" fill="#94A3B8">&lt;/body&gt;</text>
  </g>

  <!-- installed badge -->
  <g filter="url(#s4-shadow-sm)">
    <rect x="304" y="226" width="134" height="40" rx="20" fill="#10B981"/>
  </g>
  <circle cx="326" cy="246" r="10" fill="#FFFFFF"/>
  <path d="M321.4 246.2l3.2 3.2 6-6.2" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="344" y="251" font-size="14" font-weight="700" fill="#FFFFFF">Installed</text>

  <text x="40" y="290" font-size="11.5" fill="#64748B">Paste before &lt;/body&gt; &#183; works on any website</text>
</svg>
