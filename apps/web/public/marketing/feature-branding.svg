<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" role="img" aria-labelledby="fb-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="fb-title">Brand customization</title>
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <linearGradient id="fb-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="fb-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#312E81" flood-opacity=".14"/></filter>
    <clipPath id="fb-clip"><rect x="26" y="26" width="112" height="104" rx="12"/></clipPath>
  </defs>
  <rect width="240" height="160" rx="20" fill="url(#fb-bg)"/>

  <!-- widget -->
  <g filter="url(#fb-sh)"><rect x="26" y="26" width="112" height="104" rx="12" fill="#FFFFFF"/></g>
  <g clip-path="url(#fb-clip)">
    <rect x="26" y="26" width="112" height="28" fill="url(#fb-brand)"/>
    <circle cx="40" cy="40" r="6" fill="#FFFFFF" fill-opacity=".3"/>
    <text x="51" y="44" font-size="10" font-weight="700" fill="#FFFFFF">Your brand</text>
    <rect x="36" y="64" width="68" height="16" rx="8" fill="#F1F5F9"/>
    <rect x="62" y="86" width="66" height="16" rx="8" fill="url(#fb-brand)"/>
    <rect x="36" y="108" width="52" height="16" rx="8" fill="#F1F5F9"/>
  </g>
  <g filter="url(#fb-sh)"><circle cx="134" cy="128" r="13" fill="url(#fb-brand)"/></g>
  <path d="M128.5 125.5a3 3 0 0 1 3-3h5a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-3.5l-2.8 2.3v-2.4a2 2 0 0 1-1.7-2z" fill="#FFFFFF"/>

  <!-- palette -->
  <g filter="url(#fb-sh)"><rect x="154" y="26" width="64" height="104" rx="12" fill="#FFFFFF"/></g>
  <circle cx="172" cy="48" r="11.5" fill="none" stroke="#A5B4FC" stroke-width="2"/>
  <circle cx="172" cy="48" r="8" fill="#4F46E5"/>
  <circle cx="200" cy="48" r="8" fill="#7C3AED"/>
  <circle cx="172" cy="76" r="8" fill="#10B981"/>
  <circle cx="200" cy="76" r="8" fill="#F59E0B"/>
  <circle cx="172" cy="104" r="8" fill="#0EA5E9"/>
  <circle cx="200" cy="104" r="8" fill="#F43F5E"/>
  <path d="M138 48c6 0 10-1 18-1" fill="none" stroke="#A5B4FC" stroke-width="1.4" stroke-dasharray="2.5 3" stroke-linecap="round"/>
</svg>
