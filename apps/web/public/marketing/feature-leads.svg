<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" role="img" aria-labelledby="fl-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="fl-title">Lead capture inside the chat</title>
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <linearGradient id="fl-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="fl-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#312E81" flood-opacity=".14"/></filter>
    <filter id="fl-sh-g" x="-30%" y="-50%" width="160%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity=".3"/></filter>
  </defs>
  <rect width="240" height="160" rx="20" fill="url(#fl-bg)"/>

  <g filter="url(#fl-sh)"><rect x="50" y="22" width="140" height="120" rx="14" fill="#FFFFFF"/></g>
  <circle cx="72" cy="44" r="11" fill="#EEF2FF"/>
  <circle cx="72" cy="41" r="3.6" fill="#4F46E5"/>
  <path d="M65.5 50.5a6.5 5 0 0 1 13 0" fill="#4F46E5"/>
  <text x="90" y="42" font-size="11" font-weight="700" fill="#0F172A">Get a callback</text>
  <text x="90" y="54" font-size="9" fill="#64748B">Takes 10 seconds</text>

  <rect x="62" y="64" width="116" height="20" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="77.5" font-size="10" fill="#0F172A">Sam Taylor</text>
  <rect x="62" y="89" width="116" height="20" rx="6" fill="#F8FAFC" stroke="#A5B4FC"/>
  <text x="70" y="102.5" font-size="10" fill="#0F172A">sam@mail.com</text>
  <rect x="62" y="115" width="116" height="20" rx="6" fill="url(#fl-brand)"/>
  <text x="120" y="128.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send details</text>

  <g filter="url(#fl-sh-g)"><rect x="172" y="6" width="58" height="24" rx="12" fill="#10B981"/></g>
  <text x="201" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+1 lead</text>
</svg>
