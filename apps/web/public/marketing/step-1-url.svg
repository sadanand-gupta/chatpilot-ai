<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="s1-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="s1-title">Enter your website URL</title>
  <defs>
    <linearGradient id="s1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="s1-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="s1-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#312E81" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity=".06"/>
    </filter>
    <filter id="s1-shadow-sm" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312E81" flood-opacity=".14"/>
    </filter>
    <clipPath id="s1-clip"><rect width="480" height="320" rx="24"/></clipPath>
  </defs>
  <rect width="480" height="320" rx="24" fill="url(#s1-bg)"/>
  <g clip-path="url(#s1-clip)">
    <circle cx="420" cy="270" r="70" fill="#E0E7FF" opacity=".6"/>
    <circle cx="54" cy="56" r="40" fill="#EDE9FE" opacity=".8"/>
  </g>

  <!-- card -->
  <g filter="url(#s1-shadow)">
    <rect x="60" y="72" width="360" height="182" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="94" cy="106" r="16" fill="#EEF2FF"/>
  <g fill="none" stroke="#4F46E5" stroke-width="1.6">
    <circle cx="94" cy="106" r="8"/>
    <ellipse cx="94" cy="106" rx="3.6" ry="8"/>
    <path d="M86 106h16"/>
  </g>
  <text x="120" y="102" font-size="14" font-weight="700" fill="#0F172A">Train your chatbot</text>
  <text x="120" y="119" font-size="11.5" fill="#64748B">Paste your website address to begin</text>

  <!-- input with focus ring -->
  <rect x="76" y="136" width="328" height="48" rx="14" fill="none" stroke="#C7D2FE" stroke-width="4"/>
  <rect x="78" y="138" width="324" height="44" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="96" y="165" font-size="14" textLength="178" lengthAdjust="spacingAndGlyphs"><tspan fill="#94A3B8">https://</tspan><tspan fill="#0F172A" font-weight="600">yourbusiness.com</tspan></text>
  <rect x="277" y="150" width="2" height="20" rx="1" fill="#4F46E5"/>

  <!-- button -->
  <rect x="78" y="196" width="324" height="42" rx="12" fill="url(#s1-brand)"/>
  <text x="240" y="222" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Generate my chatbot &#8594;</text>

  <!-- pointer -->
  <path d="M352 214l0 26 6.5-6 4.5 10 4.5-2-4.5-10 8.5-.5z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- floating chips -->
  <g filter="url(#s1-shadow-sm)">
    <rect x="300" y="36" width="138" height="28" rx="14" fill="#FFFFFF"/>
  </g>
  <circle cx="318" cy="50" r="7" fill="#D1FAE5"/>
  <path d="M314.6 50.2l2.4 2.4 4.4-4.6" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="331" y="54" font-size="11.5" font-weight="600" fill="#0F172A">No code needed</text>

  <g filter="url(#s1-shadow-sm)">
    <rect x="42" y="266" width="150" height="28" rx="14" fill="#FFFFFF"/>
  </g>
  <path d="M60 272.5l1.4 3.4 3.4 1.4-3.4 1.4L60 282l-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#7C3AED"/>
  <text x="72" y="284" font-size="11.5" font-weight="600" fill="#0F172A">Ready in minutes</text>
</svg>
