<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" role="img" aria-labelledby="fd-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="fd-title">Works on desktop and mobile</title>
  <defs>
    <linearGradient id="fd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <linearGradient id="fd-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="fd-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E1B4B" flood-opacity=".18"/></filter>
    <clipPath id="fd-ph"><rect x="164" y="54" width="44" height="88" rx="9"/></clipPath>
  </defs>
  <rect width="240" height="160" rx="20" fill="url(#fd-bg)"/>

  <!-- monitor -->
  <path d="M90 118h24l4 16H86z" fill="#CBD5E1"/>
  <rect x="74" y="132" width="56" height="6" rx="3" fill="#94A3B8"/>
  <g filter="url(#fd-sh)"><rect x="28" y="24" width="148" height="98" rx="10" fill="#0F172A"/></g>
  <rect x="33" y="29" width="138" height="86" rx="6" fill="#FFFFFF"/>
  <rect x="40" y="36" width="16" height="5" rx="2.5" fill="#10B981"/>
  <rect x="118" y="36" width="44" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="40" y="50" width="62" height="8" rx="3" fill="#0F172A"/>
  <rect x="40" y="62" width="48" height="8" rx="3" fill="#0F172A"/>
  <rect x="40" y="76" width="60" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="40" y="84" width="50" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="40" y="96" width="30" height="10" rx="5" fill="#10B981"/>
  <!-- desktop widget -->
  <rect x="112" y="52" width="48" height="56" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <path d="M112 59a7 7 0 0 1 7-7h34a7 7 0 0 1 7 7v5h-48z" fill="url(#fd-brand)"/>
  <rect x="117" y="70" width="28" height="7" rx="3.5" fill="#E2E8F0"/>
  <rect x="127" y="81" width="28" height="7" rx="3.5" fill="url(#fd-brand)"/>
  <rect x="117" y="92" width="22" height="7" rx="3.5" fill="#E2E8F0"/>

  <!-- phone -->
  <g filter="url(#fd-sh)"><rect x="160" y="50" width="52" height="96" rx="12" fill="#0F172A"/></g>
  <g clip-path="url(#fd-ph)">
    <rect x="164" y="54" width="44" height="88" fill="#F8FAFC"/>
    <rect x="164" y="54" width="44" height="26" fill="url(#fd-brand)"/>
    <rect x="168" y="86" width="28" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="176" y="99" width="28" height="9" rx="4.5" fill="url(#fd-brand)"/>
    <rect x="168" y="112" width="32" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="168" y="127" width="36" height="9" rx="4.5" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="178" y="57" width="16" height="4.5" rx="2.25" fill="#0F172A"/>
  <circle cx="173" cy="71" r="4" fill="#FFFFFF" fill-opacity=".35"/>
  <rect x="180" y="69" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity=".85"/>
</svg>
