<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="og-title">ChatPilot AI: Turn your website into an AI assistant in minutes</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1023"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="og-glow-a" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-b" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="og-brand-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="og-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="og-sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <filter id="og-sh-sm" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".3"/>
    </filter>
    <clipPath id="og-browser"><rect x="790" y="96" width="340" height="300" rx="14"/></clipPath>
    <clipPath id="og-panel"><rect x="962" y="158" width="156" height="226" rx="12"/></clipPath>
    <clipPath id="og-screen"><rect x="746" y="256" width="118" height="248" rx="17"/></clipPath>
    <g id="og-check"><circle r="9" fill="#10B981"/><path d="M-3.8.2l2.6 2.6 5-5.2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="980" cy="160" r="420" fill="url(#og-glow-a)"/>
  <circle cx="160" cy="640" r="340" fill="url(#og-glow-b)"/>
  <g fill="#FFFFFF" fill-opacity=".05">
    <circle cx="560" cy="80" r="2"/><circle cx="600" cy="80" r="2"/><circle cx="640" cy="80" r="2"/><circle cx="680" cy="80" r="2"/>
    <circle cx="560" cy="120" r="2"/><circle cx="600" cy="120" r="2"/><circle cx="640" cy="120" r="2"/><circle cx="680" cy="120" r="2"/>
  </g>

  <g transform="translate(0 26)">
  <!-- logo -->
  <g transform="translate(80 68)">
    <rect width="64" height="64" rx="16" fill="url(#og-brand)"/>
    <rect width="64" height="64" rx="16" fill="url(#og-sheen)"/>
    <path d="M15 23a9 9 0 0 1 9-9h16a9 9 0 0 1 9 9v10a9 9 0 0 1-9 9h-8.5L23 49v-7h-.5A7.5 7.5 0 0 1 15 34.5z" fill="#FFFFFF"/>
    <path d="M40 20 34.8 30.8 29.2 25.2z" fill="#4F46E5"/>
    <path d="M24 36 29.2 25.2 34.8 30.8z" fill="#A5B4FC"/>
    <circle cx="32" cy="28" r="1.8" fill="#FFFFFF"/>
    <path d="M51 7.5l1.5 3.6 3.6 1.5-3.6 1.5L51 17.7l-1.5-3.6-3.6-1.5 3.6-1.5z" fill="#6EE7B7"/>
  </g>
  <text x="162" y="112" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#FFFFFF">ChatPilot <tspan fill="#A5B4FC">AI</tspan></text>

  <!-- headline -->
  <g font-size="54" font-weight="800" letter-spacing="-1.4">
    <text x="78" y="238" fill="#FFFFFF">Turn your website</text>
    <text x="78" y="302" fill="#FFFFFF">into an AI assistant</text>
    <text x="78" y="366" fill="url(#og-accent)">in minutes.</text>
  </g>
  <text x="80" y="424" font-size="22" fill="#C7D2FE">Website-trained chat widget. One script tag to install.</text>

  <!-- pills -->
  <g font-size="16" font-weight="600" fill="#E0E7FF">
    <rect x="80" y="466" width="190" height="42" rx="21" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".14"/>
    <use href="#og-check" transform="translate(103 487)"/>
    <text x="120" y="492.5">Grounded answers</text>
    <rect x="282" y="466" width="156" height="42" rx="21" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".14"/>
    <use href="#og-check" transform="translate(305 487)"/>
    <text x="322" y="492.5">Lead capture</text>
    <rect x="450" y="466" width="156" height="42" rx="21" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".14"/>
    <use href="#og-check" transform="translate(473 487)"/>
    <text x="490" y="492.5">Multilingual</text>
  </g>

  <!-- ===== browser ===== -->
  <g filter="url(#og-sh)"><rect x="790" y="96" width="340" height="300" rx="14" fill="#FFFFFF"/></g>
  <g clip-path="url(#og-browser)">
    <rect x="790" y="96" width="340" height="30" fill="#F1F5F9"/>
    <circle cx="808" cy="111" r="4.5" fill="#F87171"/>
    <circle cx="822" cy="111" r="4.5" fill="#FBBF24"/>
    <circle cx="836" cy="111" r="4.5" fill="#34D399"/>
    <rect x="880" y="102" width="170" height="18" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="965" y="115" font-size="10" fill="#475569" text-anchor="middle">yourbusiness.com</text>
    <circle cx="812" cy="146" r="7" fill="#10B981"/>
    <rect x="824" y="142" width="64" height="8" rx="4" fill="#0F172A"/>
    <rect x="1040" y="142" width="34" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="1080" y="138" width="38" height="16" rx="8" fill="#0F172A"/>
    <rect x="806" y="176" width="140" height="14" rx="4" fill="#0F172A"/>
    <rect x="806" y="196" width="112" height="14" rx="4" fill="#0F172A"/>
    <rect x="806" y="222" width="136" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="806" y="234" width="120" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="806" y="252" width="62" height="20" rx="10" fill="#10B981"/>
    <rect x="806" y="292" width="140" height="84" rx="10" fill="#F1F5F9"/>

    <!-- chat panel -->
    <g filter="url(#og-sh-sm)"><rect x="962" y="158" width="156" height="226" rx="12" fill="#FFFFFF"/></g>
    <g clip-path="url(#og-panel)">
      <rect x="962" y="158" width="156" height="226" fill="#F8FAFC"/>
      <rect x="962" y="158" width="156" height="36" fill="url(#og-brand-h)"/>
      <circle cx="980" cy="176" r="8" fill="#FFFFFF" fill-opacity=".25"/>
      <text x="994" y="180" font-size="10.5" font-weight="700" fill="#FFFFFF">Lakeside Assistant</text>
      <rect x="1030" y="204" width="80" height="22" rx="10" fill="url(#og-brand)"/>
      <text x="1070" y="219" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Weekend hours?</text>
      <rect x="970" y="234" width="130" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="978" y="250" font-size="9.5" fill="#0F172A">Yes! We&#8217;re open</text>
      <text x="978" y="264" font-size="9.5" fill="#0F172A">Saturdays 9am&#8211;2pm.</text>
      <rect x="970" y="280" width="108" height="16" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="1024" y="291.5" font-size="8.5" font-weight="600" fill="#4338CA" text-anchor="middle">Source: Contact page</text>
      <rect x="970" y="304" width="96" height="18" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
      <text x="1018" y="316.5" font-size="8.5" font-weight="600" fill="#4F46E5" text-anchor="middle">Book a Saturday slot</text>
      <rect x="962" y="350" width="156" height="34" fill="#FFFFFF"/>
      <rect x="970" y="357" width="110" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="1097" cy="367" r="10" fill="url(#og-brand)"/>
      <path d="M1093 367.3l8-3.7-2.9 8-1.4-3z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== phone ===== -->
  <g filter="url(#og-sh)"><rect x="740" y="250" width="130" height="260" rx="23" fill="#0F172A"/></g>
  <rect x="741.5" y="251.5" width="127" height="257" rx="21.5" fill="none" stroke="#334155"/>
  <g clip-path="url(#og-screen)">
    <rect x="746" y="256" width="118" height="248" fill="#F8FAFC"/>
    <rect x="746" y="256" width="118" height="62" fill="url(#og-brand-h)"/>
    <circle cx="764" cy="298" r="8" fill="#FFFFFF" fill-opacity=".25"/>
    <rect x="777" y="292" width="62" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="777" y="302" width="30" height="4" rx="2" fill="#FFFFFF" fill-opacity=".6"/>
    <rect x="796" y="330" width="60" height="18" rx="8" fill="url(#og-brand)"/>
    <rect x="754" y="356" width="88" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="761" y="364" width="72" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="761" y="375" width="52" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="754" y="396" width="64" height="12" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <rect x="788" y="418" width="68" height="18" rx="8" fill="url(#og-brand)"/>
    <rect x="754" y="444" width="80" height="24" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="761" y="453" width="60" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="754" y="478" width="82" height="16" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="848" cy="486" r="8" fill="url(#og-brand)"/>
  </g>
  <rect x="786" y="261" width="38" height="11" rx="5.5" fill="#0F172A"/>

  <!-- floating badge -->
  <g filter="url(#og-sh-sm)"><rect x="900" y="420" width="236" height="52" rx="26" fill="#FFFFFF"/></g>
  <use href="#og-check" transform="translate(928 446) scale(1.2)"/>
  <text x="948" y="451.5" font-size="15" font-weight="700" fill="#0F172A">Answered from your site</text>
  </g>
</svg>
