<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="s3-title" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="s3-title">Customize your chatbot's look and behavior</title>
  <defs>
    <linearGradient id="s3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="s3-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="s3-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#312E81" flood-opacity=".14"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity=".06"/>
    </filter>
    <clipPath id="s3-prev-clip"><rect x="278" y="52" width="172" height="196" rx="16"/></clipPath>
    <clipPath id="s3-clip"><rect width="480" height="320" rx="24"/></clipPath>
  </defs>
  <rect width="480" height="320" rx="24" fill="url(#s3-bg)"/>
  <g clip-path="url(#s3-clip)">
    <circle cx="400" cy="290" r="70" fill="#EDE9FE" opacity=".8"/>
  </g>

  <!-- settings panel -->
  <g filter="url(#s3-shadow)">
    <rect x="30" y="34" width="224" height="252" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="50" y="64" font-size="13.5" font-weight="700" fill="#0F172A">Appearance</text>
  <text x="50" y="90" font-size="11" font-weight="500" fill="#64748B">Brand color</text>
  <circle cx="62" cy="112" r="14" fill="none" stroke="#A5B4FC" stroke-width="2"/>
  <circle cx="62" cy="112" r="10" fill="#4F46E5"/>
  <circle cx="92" cy="112" r="10" fill="#7C3AED"/>
  <circle cx="120" cy="112" r="10" fill="#10B981"/>
  <circle cx="148" cy="112" r="10" fill="#F59E0B"/>
  <circle cx="176" cy="112" r="10" fill="#0EA5E9"/>
  <circle cx="204" cy="112" r="10" fill="#F43F5E"/>

  <text x="50" y="146" font-size="11" font-weight="500" fill="#64748B">Assistant name</text>
  <rect x="50" y="154" width="184" height="30" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="173.5" font-size="12" fill="#0F172A">Lakeside Assistant</text>

  <path d="M50 200h184" stroke="#F1F5F9"/>
  <text x="50" y="224" font-size="12" font-weight="500" fill="#334155">Capture leads</text>
  <rect x="198" y="210" width="36" height="20" rx="10" fill="#4F46E5"/>
  <circle cx="224" cy="220" r="7.5" fill="#FFFFFF"/>
  <text x="50" y="258" font-size="12" font-weight="500" fill="#334155">Show sources</text>
  <rect x="198" y="244" width="36" height="20" rx="10" fill="#4F46E5"/>
  <circle cx="224" cy="254" r="7.5" fill="#FFFFFF"/>

  <!-- live preview -->
  <circle cx="284" cy="36" r="3.5" fill="#10B981"/>
  <text x="293" y="40" font-size="10.5" font-weight="700" letter-spacing=".8" fill="#4F46E5">LIVE PREVIEW</text>
  <g filter="url(#s3-shadow)">
    <rect x="278" y="52" width="172" height="196" rx="16" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#s3-prev-clip)">
    <rect x="278" y="52" width="172" height="196" fill="#F8FAFC"/>
    <rect x="278" y="52" width="172" height="44" fill="url(#s3-brand)"/>
    <circle cx="299" cy="74" r="10" fill="#FFFFFF" fill-opacity=".22"/>
    <path d="M294.5 71a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v2.4a3 3 0 0 1-3 3h-3l-2.4 2v-2a2 2 0 0 1-1.6-2z" fill="#FFFFFF"/>
    <text x="315" y="71" font-size="11" font-weight="700" fill="#FFFFFF">Lakeside Assistant</text>
    <text x="315" y="85" font-size="9.5" fill="#E0E7FF">Online</text>

    <rect x="290" y="108" width="122" height="30" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="300" y="127" font-size="10.5" fill="#0F172A">Hi! How can I help?</text>
    <rect x="352" y="146" width="86" height="26" rx="11" fill="url(#s3-brand)"/>
    <text x="395" y="163" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Opening hours?</text>
    <rect x="290" y="180" width="110" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="290" y="194" width="84" height="9" rx="4.5" fill="#E2E8F0"/>

    <rect x="278" y="214" width="172" height="34" fill="#FFFFFF"/>
    <path d="M278 214h172" stroke="#E2E8F0"/>
    <rect x="288" y="221" width="124" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="428" cy="231" r="11" fill="url(#s3-brand)"/>
    <path d="M423.5 231.5l9-4.2-3.2 9-1.6-3.3z" fill="#FFFFFF"/>
  </g>
  <circle cx="434" cy="272" r="17" fill="url(#s3-brand)"/>
  <path d="M427.5 269.5a3.5 3.5 0 0 1 3.5-3.5h6a3.5 3.5 0 0 1 3.5 3.5v3.4a3.5 3.5 0 0 1-3.5 3.5H432l-3 2.6v-2.7a2 2 0 0 1-1.5-1.9z" fill="#FFFFFF"/>

  <!-- connector from swatch to preview -->
  <path d="M220 96c30-30 50-40 66-44" fill="none" stroke="#A5B4FC" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>
</svg>
