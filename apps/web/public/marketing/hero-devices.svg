      <rect x="68" y="544" width="80" height="7" rx="3.5" fill="#E2E8F0"/>
      <text x="68" y="580" font-size="11.5" font-weight="600" fill="#059669">Learn more &#8594;</text>
    </g>
    <g>
      <rect x="238" y="424" width="170" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="254" y="440" width="36" height="36" rx="10" fill="#EEF2FF"/>
      <path d="M264 465l8-14 8 14z" fill="none" stroke="#6366F1" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="254" y="502" font-size="13" font-weight="700" fill="#0F172A">Whitening</text>
      <rect x="254" y="516" width="128" height="7" rx="3.5" fill="#E2E8F0"/>
      <rect x="254" y="530" width="100" height="7" rx="3.5" fill="#E2E8F0"/>
      <rect x="254" y="544" width="116" height="7" rx="3.5" fill="#E2E8F0"/>
      <text x="254" y="580" font-size="11.5" font-weight="600" fill="#059669">Learn more &#8594;</text>
