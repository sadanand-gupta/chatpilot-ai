    <rect x="196" y="352.5" width="124" height="37" rx="18.5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="258" y="375.5" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Our services</text>

