    <text x="72" y="117" font-size="15" font-weight="700" fill="#0F172A">Lakeside Dental</text>
    <text x="470" y="116" font-size="12.5" fill="#64748B">Services</text>
    <text x="545" y="116" font-size="12.5" fill="#64748B">Pricing</text>
