<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="hd-title hd-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="hd-title">ChatPilot AI widget on desktop and mobile</title>
  <desc id="hd-desc">A small-business website in a desktop browser with the ChatPilot AI chat widget open, answering a visitor's question about weekend appointments with a cited source, next to a phone showing the same conversation full-screen with lead capture.</desc>
  <defs>
    <linearGradient id="hd-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hd-brand-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hd-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/>
      <stop offset=".55" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <radialGradient id="hd-glow-a" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#818CF8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd-glow-b" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="hd-shadow-lg" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1E1B4B" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity=".06"/>
    </filter>
    <filter id="hd-shadow-md" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#312E81" flood-opacity=".22"/>
    </filter>
    <filter id="hd-shadow-sm" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1E1B4B" flood-opacity=".16"/>
    </filter>
    <clipPath id="hd-browser-clip"><rect x="16" y="40" width="920" height="600" rx="16"/></clipPath>
    <clipPath id="hd-panel-clip"><rect x="610" y="214" width="280" height="360" rx="18"/></clipPath>
    <clipPath id="hd-screen-clip"><rect x="911" y="261" width="258" height="538" rx="31"/></clipPath>
    <!-- reusable bits -->
    <g id="hd-doc-icon"><path d="M0 0h6l3 3v8a1 1 0 0 1-1 1H0a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linejoin="round"/><path d="M1.5 6h5M1.5 8.5h5" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round"/></g>
    <g id="hd-bot-face"><path d="M-6 -3.5a3.5 3.5 0 0 1 3.5-3.5h5a3.5 3.5 0 0 1 3.5 3.5v3a3.5 3.5 0 0 1-3.5 3.5H-1l-3 2.6V3h0a2 2 0 0 1-2-2z" fill="#FFFFFF"/><path d="M2.6 -4.2 0.6 0.3 -1.2 -1.5z" fill="#4F46E5"/><path d="M-2.4 1.4 -1.2 -1.5 0.6 0.3z" fill="#A5B4FC"/></g>
  </defs>

  <!-- ambient glows -->
  <circle cx="320" cy="300" r="290" fill="url(#hd-glow-a)"/>
  <circle cx="940" cy="560" r="250" fill="url(#hd-glow-b)"/>

