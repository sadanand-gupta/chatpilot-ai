    <text x="934" y="488" font-size="12" fill="#0F172A">Yes! We&#8217;re open Saturdays</text>
    <text x="934" y="505" font-size="12" fill="#0F172A">9am&#8211;2pm. Would you like to</text>
    <text x="934" y="522" font-size="12" fill="#0F172A">book a slot?</text>
    <rect x="922" y="543" width="146" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
    <use href="#hd-doc-icon" transform="translate(933 548)"/>
