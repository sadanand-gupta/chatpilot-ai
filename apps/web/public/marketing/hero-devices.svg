      <text x="736" y="320" font-size="12" fill="#FFFFFF">appointments?</text>

      <!-- bot answer -->
      <circle cx="632" cy="356" r="12" fill="url(#hd-brand)"/>
      <use href="#hd-bot-face" transform="translate(632 356) scale(.95)"/>
      <rect x="652" y="342" width="222" height="68" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
