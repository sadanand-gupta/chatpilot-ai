    <circle cx="510" cy="214" r="24" fill="#FFFFFF" opacity=".8"/>
    <path d="M448 340c60-50 120-70 190-40s110 10 160-22 80-20 102-4v106a16 16 0 0 1-16 16H464a16 16 0 0 1-16-16z" fill="#A7F3D0" opacity=".75"/>
